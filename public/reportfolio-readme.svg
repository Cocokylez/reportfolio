<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">Adrian Kyle Condeza — Portfolio</title>
  <desc id="description">A dark portfolio banner introducing Adrian Kyle Condeza and showing progress for FitSched and Huely.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0c0f"/>
      <stop offset="1" stop-color="#070809"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientTransform="translate(106 52) rotate(38) scale(430 270)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563eb" stop-opacity=".18"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#2563eb"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="panelShadow" x="-25%" y="-25%" width="150%" height="165%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".42"/>
    </filter>
    <clipPath id="canvasClip">
      <rect x="1" y="1" width="1198" height="418" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#canvasClip)">
    <rect x="1" y="1" width="1198" height="418" fill="url(#background)"/>
    <rect x="1" y="1" width="1198" height="418" fill="url(#blueGlow)"/>
    <circle cx="1152" cy="14" r="170" fill="#60a5fa" opacity=".025"/>
    <circle cx="1112" cy="420" r="210" fill="#2563eb" opacity=".025"/>
  </g>
  <rect x="1" y="1" width="1198" height="418" rx="28" fill="none" stroke="#20242b" stroke-width="2"/>

  <g font-family="Inter, DM Sans, ui-sans-serif, system-ui, sans-serif">
    <circle cx="78" cy="61" r="5" fill="#30d158"/>
    <circle cx="78" cy="61" r="10" fill="none" stroke="#30d158" stroke-opacity=".12" stroke-width="6"/>
    <text x="97" y="66" fill="#8f949c" font-size="13" font-weight="650" letter-spacing="2.3">OPEN TO OPPORTUNITIES</text>

    <text x="70" y="154" fill="#f3f3f3" font-family="Georgia, DM Serif Display, ui-serif, serif" font-size="61" font-weight="400" letter-spacing="-2.2">ADRIAN KYLE</text>
    <text x="70" y="216" fill="#c8c8c8" font-family="Georgia, DM Serif Display, ui-serif, serif" font-size="61" font-weight="400" letter-spacing="-2.2">CONDEZA</text>

    <text x="73" y="258" fill="#60a5fa" font-size="14" font-weight="700" letter-spacing="2.5">FIRST-YEAR IT STUDENT</text>
    <text x="73" y="298" fill="#83878d" font-size="19" font-weight="400">Learning by building practical web projects.</text>

    <g transform="translate(72 323)" font-size="12" font-weight="650" letter-spacing="1.1">
      <rect width="132" height="34" rx="17" fill="#14171c" stroke="#2a3038"/>
      <text x="66" y="22" fill="#aeb3ba" text-anchor="middle">WEB PROJECTS</text>
      <rect x="144" width="143" height="34" rx="17" fill="#14171c" stroke="#2a3038"/>
      <text x="215.5" y="22" fill="#aeb3ba" text-anchor="middle">STUDENT BUILDER</text>
      <rect x="299" width="118" height="34" rx="17" fill="#142019" stroke="#254a31"/>
      <text x="358" y="22" fill="#78c993" text-anchor="middle">OPEN TO WORK</text>
    </g>

    <text x="73" y="388" fill="#646970" font-size="14" font-weight="500">kylesportfolio.vercel.app</text>
    <line x1="280" y1="383" x2="310" y2="383" stroke="#30343b"/>
    <text x="329" y="388" fill="#646970" font-size="14" font-weight="500">github.com/Cocokylez</text>
  </g>

  <line x1="768" y1="53" x2="768" y2="367" stroke="#24282f"/>

  <g clip-path="url(#canvasClip)" filter="url(#panelShadow)" font-family="Inter, DM Sans, ui-sans-serif, system-ui, sans-serif">
    <rect x="806" y="42" width="334" height="336" rx="24" fill="#101216" stroke="#292d35"/>
    <path d="M830 43H1116" stroke="#fff" stroke-opacity=".04"/>

    <text x="834" y="82" fill="#777c84" font-size="13" font-weight="700" letter-spacing="2">SELECTED WORK</text>
    <g transform="translate(1081 61)">
      <rect width="35" height="35" rx="10" fill="#172033" stroke="#2c4771"/>
      <text x="17.5" y="23" fill="#60a5fa" font-size="11" font-weight="750" text-anchor="middle">AKC</text>
    </g>

    <g>
      <text x="834" y="132" fill="#e6e7e9" font-family="Georgia, DM Serif Display, ui-serif, serif" font-size="27">FitSched</text>
      <text x="834" y="157" fill="#747981" font-size="15">Workout scheduling</text>
      <rect x="834" y="180" width="258" height="4" rx="2" fill="#242830"/>
      <rect x="834" y="180" width="255" height="4" rx="2" fill="url(#bar)"/>
      <text x="834" y="208" fill="#858a92" font-size="13" font-weight="650" letter-spacing="1.1">READY TO PUBLISH</text>
      <text x="1092" y="208" fill="#60a5fa" font-size="13" font-weight="700" text-anchor="end">99%</text>
    </g>

    <line x1="834" y1="232" x2="1112" y2="232" stroke="#272b32"/>

    <g>
      <text x="834" y="273" fill="#e6e7e9" font-family="Georgia, DM Serif Display, ui-serif, serif" font-size="27">Huely</text>
      <text x="834" y="298" fill="#747981" font-size="15">Photo-to-canvas painting guide</text>
      <rect x="834" y="321" width="258" height="4" rx="2" fill="#242830"/>
      <rect x="834" y="321" width="129" height="4" rx="2" fill="url(#bar)" opacity=".72"/>
      <text x="834" y="349" fill="#858a92" font-size="13" font-weight="650" letter-spacing="1.1">IN PROGRESS</text>
      <text x="1092" y="349" fill="#8aaedc" font-size="13" font-weight="700" text-anchor="end">50%</text>
    </g>
  </g>
</svg>
